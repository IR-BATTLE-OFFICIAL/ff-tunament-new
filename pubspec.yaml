name: ff_arena
description: "A new Flutter project."
publish_to: 'none'

version: 1.2.0+5

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.10.1
  firebase_auth: ^5.4.1
  cloud_firestore: ^5.6.1
  firebase_storage: ^12.4.2
  firebase_messaging: ^15.2.10
  provider: ^6.1.2
  google_sign_in: ^6.2.2
  intl: ^0.19.0
  image_picker: ^1.1.2
  shared_preferences: ^2.3.5
  file_picker: ^8.0.0
  cached_network_image: ^3.4.1
  lottie: ^3.1.2
  font_awesome_flutter: ^10.7.0
  uuid: ^4.4.0
  shimmer: ^3.0.0
  carousel_slider: ^5.0.0
  razorpay_flutter: ^1.3.11
  url_launcher: ^6.3.0
  share_plus: ^10.1.2
  package_info_plus: ^8.0.0
  device_info_plus: ^12.4.0
  http: ^1.2.1
  supabase_flutter: ^2.8.1
  flutter_sms_inbox: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_launcher.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_launcher.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
